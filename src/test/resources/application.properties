# Testcontainers PostgreSQL
spring.test.database.replace=none
spring.datasource.url=jdbc:tc:postgresql:18.6:///camunda_db?TC_INITSCRIPT=file:src/main/resources/db/changelog/baseline/init/init.sql
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=postgres
spring.datasource.password=postgres
# JPA / Liquibase
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.liquibase.enabled=true
spring.liquibase.change-log=db/changelog/changelog-master.xml
# Camunda — отключаем всё, что требует живой брокер
camunda.client.mode=self-managed
camunda.client.auth.method=none
camunda.client.deployment.enabled=false
camunda.client.worker.defaults.enabled=false
# Фикс SSL health indicator
spring.autoconfigure.exclude=org.springframework.boot.health.autoconfigure.application.SslHealthContributorAutoConfiguration
