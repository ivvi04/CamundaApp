# Название приложения
spring.application.name=camunda-app
# PostgreSQL — подключение к локальной БД (порт 5434)
spring.datasource.url=jdbc:postgresql://localhost:5434/camunda_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
# JPA — Hibernate не управляет схемой, миграции делает Liquibase
spring.jpa.hibernate.ddl-auto=none
# Не держим EntityManager открытым на время рендеринга ответа:
# маппинг в домен выполняется внутри транзакций адаптеров
spring.jpa.open-in-view=false
# Liquibase — миграции БД, схема по умолчанию camunda_app
spring.liquibase.change-log=db/changelog/changelog-master.xml
spring.liquibase.default-schema=camunda_app
# Camunda — self-managed режим, подключение к локальному Zeebe-брокеру без авторизации
camunda.client.mode=self-managed
camunda.client.auth.method=none
# Адреса по умолчанию — для локального запуска; в Docker переопределяются переменными окружения
camunda.client.grpc-address=${CAMUNDA_GRPC_ADDRESS:http://localhost:26500}
camunda.client.rest-address=${CAMUNDA_REST_ADDRESS:http://localhost:8082}
# Фикс SSL health indicator
spring.autoconfigure.exclude=org.springframework.boot.health.autoconfigure.application.SslHealthContributorAutoConfiguration
