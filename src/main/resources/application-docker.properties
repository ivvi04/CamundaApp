# Название приложения
spring.application.name=camunda-app
# PostgreSQL — подключение к БД внутри Docker-сети (имя контейнера postgres, порт 5432)
spring.datasource.url=jdbc:postgresql://postgres:5432/camunda_db?currentSchema=camunda_app
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
# JPA — Hibernate не управляет схемой, миграции делает Liquibase
spring.jpa.hibernate.ddl-auto=none
# Liquibase — миграции БД, схема по умолчанию camunda_app
spring.liquibase.change-log=db/changelog/changelog-master.xml
spring.liquibase.default-schema=camunda_app
# Camunda — self-managed режим, подключение к Zeebe-брокеру в Docker-сети
# (имя контейнера orchestration) без авторизации
camunda.client.mode=self-managed
camunda.client.auth.method=none
camunda.client.grpc-address=http://orchestration:26500
camunda.client.rest-address=http://orchestration:8080
