name: CamundaApp

services:
  postgres:
    image: 'postgres:18.6'
    container_name: 'camunda-postgres'
    environment:
      POSTGRES_DB: camunda_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    volumes:
      - ./src/main/resources/db/changelog/baseline/init/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - camunda-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  camunda-app:
    image: camunda-app
    build:
      dockerfile: Dockerfile
    container_name: 'camunda-app'
    environment:
      - "SPRING_PROFILES_ACTIVE=docker"
    ports:
      - 8080:8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - camunda-net

networks:
  camunda-net:
    driver: bridge